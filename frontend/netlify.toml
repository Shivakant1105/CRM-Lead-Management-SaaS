[build]
  publish = "dist/flowcrm-frontend/browser"
  command = "npm run build"

[[redirects]]
  from = "/api/*"
  to = "https://flowcrm-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/actuator/*"
  to = "https://flowcrm-backend.onrender.com/actuator/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
