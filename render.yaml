# Render Blueprint Specification Version 1
version: "1"

services:
  - type: web
    name: flowcrm-backend
    runtime: docker
    repo: https://github.com/Shivakant1105/CRM-Lead-Management-SaaS
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: flowcrm-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: flowcrm-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: flowcrm-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://crm-lead-management-saas.netlify.app,http://localhost:4200,http://localhost

databases:
  - name: flowcrm-db
    databaseName: flowcrm
    user: flowcrm_user
    region: singapore
    plan: free
